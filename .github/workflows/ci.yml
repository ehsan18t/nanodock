# nanodock - CI Pipeline
# Enforces code quality on pull requests. All checks must pass before merging.
#
# Quality gates 1 to 7: the list lives in docs/CONTRIBUTING.md (Quality Gates);
# each step below is named after the gate it runs.
#
# MSRV (Linux):
#   - cargo check on Rust 1.89, the rust-version declared in Cargo.toml
#
# Package verify (Linux):
#   - cargo package --list and cargo publish --dry-run
#
# Docker integration (Linux):
#   - tests/daemon_it.rs against the runner's Docker Engine, over the unix
#     socket and over a TCP DOCKER_HOST
#
# Rootless Podman integration (Linux):
#   - tests/podman_it.rs: Docker and Podman merged in one map, stop falling
#     through Docker's 404 to Podman, and the rootlessport resolver
#
# Linux benchmark execution:
#   - gungraun instruction-count regressions vs PR merge-base

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Principle of least privilege - CI only reads source, never pushes.
permissions:
  contents: read

# Cancel any in-progress run for the same PR branch to avoid wasted minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  quality-gate:
    name: Quality Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 1.94.1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true

      # Gate 1: Formatting - rejects inconsistent style
      - name: "Gate 1: cargo fmt --check"
        run: cargo fmt --all -- --check

      # Gate 2: Clippy (all+pedantic+nursery at deny level) - rejects lint violations.
      # Lint levels and per-lint overrides are configured in Cargo.toml [lints.clippy].
      - name: "Gate 2: cargo clippy"
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --all-features -- -D warnings

      # Gate 3: Tests - rejects broken logic; --locked ensures Cargo.lock is honoured
      - name: "Gate 3: cargo test"
        run: |
          cargo test --locked --lib --tests --all-features
          cargo test --locked --doc --all-features

      # Gate 4: Benchmarks - rejects benchmarks that do not compile
      - name: "Gate 4: cargo bench --no-run"
        run: cargo bench --locked --no-run

      # Gate 5: Build - rejects code that does not compile
      - name: "Gate 5: cargo build"
        run: cargo build --locked

      # Gate 6: Documentation & doc-comment format - rejects broken links, bare URLs,
      # invalid code blocks, and missing crate-level docs.
      - name: "Gate 6: cargo doc"
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: >-
            -D warnings
            -D rustdoc::bare_urls
            -D rustdoc::invalid_rust_codeblocks
            -D rustdoc::private_intra_doc_links
            -D rustdoc::unescaped_backticks

  # Minimum supported Rust version: proves the `rust-version` declared in
  # Cargo.toml still compiles every target (lib, tests, benches). Lints and
  # warnings are gated on stable by the quality gate, so RUSTFLAGS is cleared
  # here to keep newer-compiler-only lint names from failing an older rustc.
  msrv:
    name: MSRV (Rust 1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 1.94.1
        with:
          toolchain: "1.89"

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
          key: msrv

      - name: "MSRV: cargo check --all-targets"
        run: cargo check --locked --all-targets --all-features

  # Package verification: lists the files that would ship to crates.io and runs
  # a publish dry run, which builds the packaged crate in isolation. Catches a
  # source file missing from the Cargo.toml `include` list before a release.
  package:
    name: Package Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 1.94.1
        with:
          toolchain: stable

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
          key: package

      - name: "Package: list published files"
        run: cargo package --locked --list

      - name: "Package: cargo publish --dry-run"
        run: cargo publish --locked --dry-run

  # Integration tests against a real Docker daemon (tests/daemon_it.rs).
  #
  # The unit tests drive fake daemons; this job proves detection, port
  # matching, and stop/kill against the Docker Engine preinstalled on the
  # runner. The job env below is the single source of the container names and
  # ports: the containers are started from it and the tests read it.
  docker-it:
    name: Docker Integration (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NANODOCK_IT_WEB_NAME: nd-web
      NANODOCK_IT_WILDCARD_PORT: "18080"
      NANODOCK_IT_LOOPBACK_PORT: "18081"
      NANODOCK_IT_RANGE: "18090-18092"
      NANODOCK_IT_UDP_PORT: "18093"
      NANODOCK_IT_COMPOSE_PROJECT: itproj
      NANODOCK_IT_COMPOSE_SERVICE: web
      NANODOCK_IT_COMPOSE_PORT: "18100"
      NANODOCK_IT_STOP_NAME: nd-stop
      NANODOCK_IT_STOP_PORT: "18110"
      NANODOCK_IT_KILL_NAME: nd-kill
      NANODOCK_IT_KILL_PORT: "18111"
      NANODOCK_IT_TCP_KILL_NAME: nd-tcp-kill
      COMPOSE_FILE: tests/fixtures/compose.yaml
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 1.94.1
        with:
          toolchain: stable

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
          key: docker-it

      - name: Build the integration tests
        run: cargo test --locked --test daemon_it --no-run

      - name: Install socat
        run: |
          sudo apt-get update
          sudo apt-get install -y socat

      # Docker Hub pulls occasionally fail on shared runners; retry before
      # giving up so a registry hiccup is not reported as a nanodock bug.
      - name: Pull the test image
        run: |
          for attempt in 1 2 3 4 5; do
            docker pull busybox && exit 0
            echo "pull attempt $attempt failed, retrying"
            sleep $((attempt * 5))
          done
          exit 1

      # --init runs tini as PID 1, which forwards SIGTERM to httpd, so a
      # graceful stop finishes at once instead of after the 10 second grace.
      - name: Start the test containers
        run: |
          docker run -d --init --name "$NANODOCK_IT_WEB_NAME" \
            -p "$NANODOCK_IT_WILDCARD_PORT:80" \
            -p "127.0.0.1:$NANODOCK_IT_LOOPBACK_PORT:80" \
            -p "$NANODOCK_IT_RANGE:8090-8092" \
            -p "$NANODOCK_IT_UDP_PORT:5353/udp" \
            busybox httpd -f -p 80
          docker run -d --init --name "$NANODOCK_IT_STOP_NAME" \
            -p "$NANODOCK_IT_STOP_PORT:80" busybox httpd -f -p 80
          docker run -d --init --name "$NANODOCK_IT_KILL_NAME" \
            -p "$NANODOCK_IT_KILL_PORT:80" busybox httpd -f -p 80
          docker run -d --init --name "$NANODOCK_IT_TCP_KILL_NAME" busybox httpd -f -p 80
          docker compose -p "$NANODOCK_IT_COMPOSE_PROJECT" up -d --wait
          docker ps

      - name: "Docker IT: unix socket"
        env:
          NANODOCK_IT: "1"
        run: cargo test --locked --test daemon_it -- --test-threads=1 --nocapture

      # socat runs as root and forwards TCP to the daemon socket. The socket is
      # then made root-only, so the test process can reach the daemon over TCP
      # alone: a pass proves detection and kill travel the DOCKER_HOST path.
      - name: "Docker IT: DOCKER_HOST over TCP"
        env:
          NANODOCK_IT_TCP_HOST: tcp://127.0.0.1:2375
        run: |
          sudo socat TCP-LISTEN:2375,bind=127.0.0.1,fork,reuseaddr UNIX-CONNECT:/var/run/docker.sock &
          trap 'sudo chmod 660 /var/run/docker.sock; sudo pkill -x socat || true' EXIT
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:2375/_ping && break
            if [ "$attempt" -eq 30 ]; then echo "socat forwarder never answered"; exit 1; fi
            sleep 1
          done
          sudo chmod 600 /var/run/docker.sock
          cargo test --locked --test daemon_it tcp_ -- --test-threads=1 --nocapture

      - name: Clean up containers
        if: always()
        run: |
          sudo chmod 660 /var/run/docker.sock || true
          sudo pkill -x socat || true
          docker compose -p "$NANODOCK_IT_COMPOSE_PROJECT" down -t 0 || true
          docker rm -f "$NANODOCK_IT_WEB_NAME" "$NANODOCK_IT_STOP_NAME" \
            "$NANODOCK_IT_KILL_NAME" "$NANODOCK_IT_TCP_KILL_NAME" || true

  # Integration tests against rootless Podman next to the runner's Docker
  # Engine (tests/podman_it.rs): the multi-daemon merge, the stop fall-through
  # from Docker's 404 to Podman, and the rootlessport resolver.
  #
  # Rootless Podman needs a user systemd instance for its API socket. Linger
  # starts one; when it does not come up, `podman system service` serves the
  # same socket directly, so the tests never depend on that detail.
  podman-it:
    name: Rootless Podman Integration (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NANODOCK_IT_PODMAN_NAME: pweb
      NANODOCK_IT_PODMAN_PORT: "18180"
      NANODOCK_IT_DOCKER_NAME: nd-web
      NANODOCK_IT_DOCKER_PORT: "18080"
      NANODOCK_IT_PODMAN: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 1.94.1
        with:
          toolchain: stable

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
          key: podman-it

      - name: Build the integration tests
        run: cargo test --locked --test podman_it --no-run

      # Ubuntu 24.04 can restrict unprivileged user namespaces through
      # AppArmor, which rootless Podman needs; the sysctl is absent on older
      # images, hence the `|| true`.
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman slirp4netns uidmap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          podman --version

      - name: Start the rootless Podman API socket
        run: |
          uid="$(id -u)"
          runtime_dir="/run/user/$uid"
          sudo loginctl enable-linger "$USER"
          for attempt in $(seq 1 30); do
            [ -S "$runtime_dir/bus" ] && break
            sleep 1
          done
          if [ ! -d "$runtime_dir" ]; then
            sudo mkdir -p "$runtime_dir"
            sudo chown "$uid:$(id -g)" "$runtime_dir"
            sudo chmod 700 "$runtime_dir"
          fi
          export XDG_RUNTIME_DIR="$runtime_dir"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime_dir/bus"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          socket="$runtime_dir/podman/podman.sock"
          if ! systemctl --user enable --now podman.socket; then
            echo "systemd user socket unavailable, serving the API directly"
            mkdir -p "$runtime_dir/podman"
            nohup podman system service --time=0 "unix://$socket" > "$RUNNER_TEMP/podman-service.log" 2>&1 &
          fi
          for attempt in $(seq 1 30); do
            curl -sf --unix-socket "$socket" http://d/_ping && exit 0
            sleep 1
          done
          echo "the Podman API socket never answered"
          cat "$RUNNER_TEMP/podman-service.log" 2>/dev/null || true
          exit 1

      # The fully qualified image avoids Podman's short-name prompt, and
      # slirp4netns makes the rootlessport helper hold the published port.
      - name: Start the test containers
        run: |
          for attempt in 1 2 3 4 5; do
            podman pull docker.io/library/busybox && docker pull busybox && break
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            echo "pull attempt $attempt failed, retrying"
            sleep $((attempt * 5))
          done
          podman run -d --network slirp4netns -p "$NANODOCK_IT_PODMAN_PORT:80" \
            --name "$NANODOCK_IT_PODMAN_NAME" docker.io/library/busybox httpd -f -p 80
          docker run -d --init --name "$NANODOCK_IT_DOCKER_NAME" \
            -p "$NANODOCK_IT_DOCKER_PORT:80" busybox httpd -f -p 80
          pids=""
          for attempt in $(seq 1 15); do
            pids="$(pgrep -x rootlessport | tr '\n' ' ' || true)"
            [ -n "$pids" ] && break
            sleep 1
          done
          echo "rootlessport pids: ${pids:-none}"
          echo "NANODOCK_IT_ROOTLESSPORT_PIDS=$pids" >> "$GITHUB_ENV"
          podman ps
          docker ps

      - name: "Podman IT: detection merges Podman and Docker"
        run: cargo test --locked --test podman_it detect_ -- --test-threads=1 --nocapture

      - name: "Podman IT: rootlessport resolver"
        run: cargo test --locked --test podman_it rootless_resolver -- --test-threads=1 --nocapture

      # Runs last because it stops pweb; `podman start` is a no-op when the
      # container is already running and recovers it after a retried job.
      - name: "Podman IT: stop falls through Docker to Podman"
        run: |
          podman start "$NANODOCK_IT_PODMAN_NAME"
          cargo test --locked --test podman_it stop_ -- --test-threads=1 --nocapture

      - name: Clean up containers
        if: always()
        run: |
          podman rm -f -t 0 "$NANODOCK_IT_PODMAN_NAME" || true
          docker rm -f "$NANODOCK_IT_DOCKER_NAME" || true

  # Linux-only instruction-count benchmarks with gungraun.
  #
  # Gungraun executes under valgrind, so benchmark execution is unavailable on
  # Windows runners. Pull requests compare the PR head against a merge-base
  # baseline from `main` and fail on instruction regressions above the chosen
  # Ir limit. Pushes to `main` still run the benchmark suite as a smoke check.
  benchmark-regression:
    name: Benchmark Regression (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GUNGRAUN_SEPARATE_TARGETS: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 1.94.1
        with:
          toolchain: stable

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
          key: bench

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Install gungraun-runner
        run: |
          version=$(cargo metadata --format-version=1 | python -c "import json, sys; data = json.load(sys.stdin); print(next(pkg['version'] for pkg in data['packages'] if pkg['name'] == 'gungraun'))")
          cargo install --locked gungraun-runner --version "$version"

      - name: Resolve merge-base
        id: base
        if: github.event_name == 'pull_request'
        run: |
          base=$(git merge-base HEAD origin/${{ github.base_ref }})
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "Merge-base: $base"

      - name: Run benchmarks on merge-base (establish baseline)
        if: github.event_name == 'pull_request'
        run: |
          head_sha=$(git rev-parse HEAD)
          git checkout --detach ${{ steps.base.outputs.sha }}
          cargo bench --locked --bench benchmarks -- \
            --save-baseline main \
            --callgrind-metrics=ir \
            --save-summary=json
          git checkout --detach "$head_sha"

      - name: Run PR benchmark comparison
        if: github.event_name == 'pull_request'
        run: |
          cargo bench --locked --bench benchmarks -- \
            --baseline main \
            --callgrind-metrics=ir \
            --callgrind-limits='ir=1.0%' \
            --save-summary=json \
            | tee bench_output.txt

      - name: Run benchmark smoke check on main pushes
        if: github.event_name != 'pull_request'
        run: |
          cargo bench --locked --bench benchmarks \
            -- \
            --callgrind-metrics=ir \
            --save-summary=json \
            | tee bench_output.txt

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: benchmark-reports-${{ github.sha }}
          path: |
            bench_output.txt
            target/gungraun
          retention-days: 7
          if-no-files-found: warn

  # Gate 7: Dependency audit - rejects vulnerable/banned/unlicensed dependencies.
  # Uses EmbarkStudios/cargo-deny-action (Docker-based, pre-built binary - no
  # manual install or caching needed). Advisories are split into a separate
  # matrix entry with continue-on-error so a sudden new advisory announcement
  # does not block unrelated PRs.
  audit:
    name: Dependency Audit (${{ matrix.checks }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources
    # A new advisory should warn, not block unrelated work.
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "Gate 7: cargo deny check ${{ matrix.checks }}"
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          command: check ${{ matrix.checks }}
